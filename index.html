<!doctype html>
<html>
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Motu Patlu Road Race</title>
	<style>
		body {
			margin: 0;
			overflow: hidden;
			background: #68c7eb;
			font-family: Arial;
		}
		canvas {
			display: block;
		}
		#hud {
			position: absolute;
			top: 10px;
			left: 15px;
			right: 20px;
			display: flex;
			justify-content: space-between;
			font-weight: bold;
			font-size: 20px;
		}
		.box {
			background: yellow;
			border: 3px solid black;
			border-radius: 10px;
			padding: 8px 15px;
		}
		#buttons {
			position: absolute;
			bottom: 20px;
			left: 20px;
			right: 20px;
			display: flex;
			gap: 10px;
		}
		button {
			width: 75px;
			height: 70px;
			border-radius: 50%;
			font-size: 30px;
			background: #ffe13d;
			border: 3px solid black;
		}
		#jump {
			margin-left: auto;
		}
		#over {
			display: none;
			position: absolute;
			inset: 0;
			background: rgba(0,0,0,0.5);
			align-items: center;
			justify-content: center;
			text-align: center;
		}
		.box2 {
			background: #ffe13d;
			border: 5px solid black;
			border-radius: 15px;
			padding: 20px 40px;
		}
	</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="hud">
	<div class="box">Score: <span id="s">0</span></div>
	<div class="box">Level: <span id="l">1</span></div>
</div>

<div id="buttons">
	<button id="left">←</button>
	<button id="right">→</button>
	<button id="jump">↑</button>
</div>

<div id="over">
	<div class="box2">
		<h2>Game Over</h2>
		<p>Score: <span id="fs">0</span></p>
		<button onclick="location.reload()">Retry</button>
	</div>
</div>

<script>
// canvas setup
var c = document.getElementById("c");
var ctx = c.getContext("2d");
c.width = window.innerWidth;
c.height = window.innerHeight;

var w = c.width;
var h = c.height;

var score = 0;
var speed = 5;
var gameRunning = true;

// mera car
var myCar = { x: w / 2 - 30, y: h - 140, width: 60, height: 90 };

// dusri car jo takrayegi
var otherCar = { x: w * 0.4, y: -150, width: 55, height: 80 };

var coinList = [];

function drawBox(car, colr) {
	ctx.fillStyle = colr;
	ctx.fillRect(car.x, car.y, car.width, car.height);

	// windshield jaisa
	ctx.fillStyle = "white";
	ctx.fillRect(car.x + 10, car.y + 15, car.width - 20, 15);
}

function checkCollision(a, b) {
	if (a.x < b.x + b.width && a.x + a.width > b.x && a.y < b.y + b.height && a.y + a.height > b.y) {
		return true;
	}
	return false;
}

function gameLoop() {

	// road
	ctx.fillStyle = "#555555";
	ctx.fillRect(w * 0.25, 0, w * 0.5, h);

	otherCar.y = otherCar.y + speed;
	if (otherCar.y > h) {
		otherCar.y = -100;
		otherCar.x = w * 0.3 + Math.random() * w * 0.4;
	}

	// naya coin daalte rehna
	if (Math.random() < 0.02) {
		coinList.push({ x: w * 0.3 + Math.random() * w * 0.4, y: -20 });
	}

	for (var i = 0; i < coinList.length; i++) {
		coinList[i].y = coinList[i].y + speed;
	}

	var stillThere = [];
	for (var i = 0; i < coinList.length; i++) {
		var coin = coinList[i];
		var coinBox = { x: coin.x - 10, y: coin.y - 10, width: 20, height: 20 };

		if (checkCollision(myCar, coinBox)) {
			score = score + 1;
			document.getElementById("s").innerHTML = score;
		} else if (coin.y < h) {
			stillThere.push(coin);
		}
	}
	coinList = stillThere;

	for (var i = 0; i < coinList.length; i++) {
		ctx.fillStyle = "#ffcc00";
		ctx.beginPath();
		ctx.arc(coinList[i].x, coinList[i].y, 10, 0, Math.PI * 2);
		ctx.fill();
	}

	drawBox(otherCar, "#e67e22");
	drawBox(myCar, "#e91e63");

	if (checkCollision(myCar, otherCar)) {
		gameRunning = false;
		document.getElementById("over").style.display = "flex";
		document.getElementById("fs").innerHTML = score;
	}

	if (gameRunning) {
		requestAnimationFrame(gameLoop);
	}
}

function moveCar(amount) {
	myCar.x = myCar.x + amount;
	if (myCar.x < 0) myCar.x = 0;
	if (myCar.x > w - myCar.width) myCar.x = w - myCar.width;
}

document.getElementById("left").onclick = function () {
	moveCar(-30);
};
document.getElementById("right").onclick = function () {
	moveCar(30);
};
document.getElementById("jump").onclick = function () {
	myCar.y = myCar.y - 40;
	setTimeout(function () {
		myCar.y = myCar.y + 40;
	}, 150);
};

document.onkeydown = function (e) {
	if (e.key == "ArrowLeft") moveCar(-30);
	if (e.key == "ArrowRight") moveCar(30);
};

gameLoop();
</script>
</body>
</html>
