<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motu Patlu Road Race</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- main game area -->
  <div id="game">
    <canvas id="canvas"></canvas>

    <div id="hud">
      <div class="box">Score: <span id="score">0</span></div>

      <div id="title">
        Motu Patlu
        <small>Road Race</small>
      </div>

      <div class="box">Level: <span id="level">1</span></div>
    </div>

    <!-- mobile ke liye buttons -->
    <div id="buttons">
      <button id="left">←</button>
      <button id="right">→</button>
      <button id="jump">↑<small>Jump</small></button>
    </div>

    <div id="over">
      <div class="over-box">
        <h1>Game Over!</h1>
        <p>Your Score: <span id="final-score">0</span></p>
        <button onclick="location.reload()">Play Again</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
